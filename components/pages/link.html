        const ITEMS_PER_PAGE = 17;
        let currentPage = 1;
        let currentData = allData;

        function toggleClearButton() {
            if (!clearBtn) return;
            if (search.value.length > 0) clearBtn.classList.add('show');
            else clearBtn.classList.remove('show');
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function () {
                search.value = '';
                toggleClearButton();
                renderData(allData, 1);
                search.focus();
            });
        }

        function renderData(data, page = 1) {
            currentData = data;
            currentPage = page;
            const totalItems = data.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
            const pageData = data.slice(startIndex, endIndex);

            if (pageData.length === 0) {
                container.innerHTML = '<div class="no-data">No data found.</div>';
                countDisplay.textContent = 'খুঁজে পাওয়া: ০ টি';
                paginationContainer.innerHTML = '';
                pageInfo.textContent = '';
                return;
            }

            let html = '';
            pageData.forEach(item => {
                html += `<div class="link-item">★ <a href="${escapeHtml(item.link)}" target="_blank">${escapeHtml(item.name)}</a><hr></div>`;
            });
            container.innerHTML = html;

            countDisplay.textContent = `খুঁজে পাওয়া: ${totalItems} টি (মোট: ${allData.length} টি)`;
            renderPagination(totalPages, page);
            pageInfo.textContent = `পৃষ্ঠা ${page} / ${totalPages} (মোট ${totalItems} টি)`;
        }

        function renderPagination(totalPages, currentPage) {
            if (totalPages <= 1) { paginationContainer.innerHTML = ''; return; }
            let html = '';
            html += `<button onclick="window.__linkListChangePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>« </button>`;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            if (startPage > 1) {
                html += `<button onclick="window.__linkListChangePage(1)">1</button>`;
                if (startPage > 2) html += `<span style="margin:0 5px;">...</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="window.__linkListChangePage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span style="margin:0 5px;">...</span>`;
                html += `<button onclick="window.__linkListChangePage(${totalPages})">${totalPages}</button>`;
            }
            html += `<button onclick="window.__linkListChangePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}> »</button>`;
            paginationContainer.innerHTML = html;
        }

        // global (কেননা inline onclick ব্যবহার হচ্ছে)
        window.__linkListChangePage = function (page) {
            const totalPages = Math.ceil(currentData.length / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            renderData(currentData, page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function liveSearch() {
            const query = search.value.toLowerCase().trim();
            if (query === '') { renderData(allData, 1); return; }
            const filtered = allData.filter(item =>
                item.name.toLowerCase().includes(query) ||
                item.link.toLowerCase().includes(query)
            );
            renderData(filtered, 1);
        }

        search.addEventListener('input', function () {
            toggleClearButton();
            liveSearch();
        });

        renderData(allData, 1);
    }

    // include শেষ হলে init করো, নাহলে সরাসরি DOMContentLoaded
    if (window.__includesLoaded) {
        initLinkList();
    } else {
        document.addEventListener('includesLoaded', initLinkList, { once: true });
        // fallback: কিছুক্ষণ পরেও চেক করো
        setTimeout(function () {
            if (!window.__linkListInitDone) initLinkList();
        }, 2000);
    }
})();
