<!DOCTYPE html>
<html lang="en">
<head>
    <title>New</title>
    <div data-include="/components/head-meta.html"></div>
</head>
<body>
    <div class="container">
        <div data-include="/components/header.html"></div>

        <div class="two-column-layout">
            <div class="left-column">
                <div class="blog-view">
                    <div class="blog-content-view">
 <!-- ____________________________________ -->
 

<ul id="list"></ul>
<div class="pagination" id="pagination"></div>

    <script>
        const items = [

          
      {name: "National University Result", link: "https://results.nu.ac.bd", target: "_blank"},
      {name: "National University Result Board Challange", link: "http://103.113.200.36/PAMS/ICTUnit/Re_scrutiny.aspx", target: "_blank"},
      {name: "Basic Trade 360h Result", link: "http://www.bteb.gov.bd/site/page/a34671e3-a81c-4927-834f-19d6afc41217/%E0%A6%B8%E0%A6%B2%E0%A7%8D%E0%A6%AA-%E0%A6%AE%E0%A7%87%E0%A7%9F%E0%A6%BE%E0%A6%A6%E0%A7%80-%E0%A6%93-%E0%A6%85%E0%A6%A8%E0%A7%8D%E0%A6%AF%E0%A6%BE%E0%A6%A8%E0%A7%8D%E0%A6%AF", target: "_blank"},
      {name: "J.S.C S.S.C H.S.C Result Website", link: "http://eboardresults.com/app/stud", target: "_blank"},
      {name: "J.S.C S.S.C H.S.C Result Website 2", link: "http://www.educationboardresults.gov.bd/", target: "_blank"},
      {name: " S.S.C H.S.C Result Website 3", link: "https://eduboardresults.gov.bd", target: "_blank"},
      {name: " S.S.C H.S.C Result বোর্ড  চ্যালেঞ্জ", link: "https://rescrutiny.eduboardresults.gov.bd", target: "_blank"},

      {name: "P.S.C Result Website", link: "https://ipemis.dpe.gov.bd/scholarship-results", target: "_blank"},
      {name: "Fazil-Kamil Result", link: "http://result.iau.edu.bd/", target: "_blank"}

        ];

        let currentPage = 1;
        const itemsPerPage = 13;
        let filteredItems = [...items];

        function displayList(itemsToShow, page) {
            const list = document.getElementById('list');
            list.innerHTML = '';
            
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = itemsToShow.slice(start, end);
            
            if (paginatedItems.length === 0) {
                list.innerHTML = '<li class="no-results">No matching found</li>';
            } else {
                paginatedItems.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = item.link;
                    if (item.target) {
                        a.target = item.target;
                    }
                    a.innerHTML = `<span class="star">★</span> ${item.name}`;
                    li.appendChild(a);
                    list.appendChild(li);
                });
            }
            
            setupPagination(itemsToShow, page);
        }

        function setupPagination(itemsToShow, currentPage) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            const pageCount = Math.ceil(itemsToShow.length / itemsPerPage);
            
            if (pageCount <= 1) return;
            
            // Previous button
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.textContent = 'Prev';
                prevBtn.addEventListener('click', () => {
                    currentPage--;
                    displayList(filteredItems, currentPage);
                });
                pagination.appendChild(prevBtn);
            }
            
            // Page numbers
            for (let i = 1; i <= pageCount; i++) {
                if (i === 1 || i === pageCount || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    if (i === currentPage) {
                        btn.classList.add('active');
                    }
                    btn.addEventListener('click', () => {
                        currentPage = i;
                        displayList(filteredItems, currentPage);
                    });
                    pagination.appendChild(btn);
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    pagination.appendChild(ellipsis);
                }
            }
            
            // Next button
            if (currentPage < pageCount) {
                const nextBtn = document.createElement('button');
                nextBtn.textContent = 'Next';
                nextBtn.addEventListener('click', () => {
                    currentPage++;
                    displayList(filteredItems, currentPage);
                });
                pagination.appendChild(nextBtn);
            }
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredItems = items.filter(item => 
                item.name.toLowerCase().includes(searchTerm)
            );
            currentPage = 1;
            displayList(filteredItems, currentPage);
        });

        // Initial display
        displayList(filteredItems, currentPage);
    </script>
                        

 <!-- ____________________________________ -->                       
       
                    </div>
                </div>
            </div>

            <div data-include="/components/sidebar.html"></div>
        </div>

        <div data-include="/components/footer.html"></div>
    </div>

    <script src="/assets/include.js"></script>
</body>
</html>
