<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');

    if (code) {
        // links.json থেকে ডেটা লোড করে রিডাইরেক্ট
        fetch('links.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var link = data.links.find(function(l) { return l.code === code; });
                if (link && link.url) {
                    window.location.replace(link.url);
                } else {
                    document.body.innerHTML = '<p style="text-align:center;padding:40px;">লিংকটি পাওয়া যায়নি (Code: ' + code + ')</p>';
                }
            })
            .catch(function() {
                document.body.innerHTML = '<p style="text-align:center;padding:40px;">লোড করতে সমস্যা হয়েছে</p>';
            });
    }
})();
</script>
